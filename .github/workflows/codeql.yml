name: CodeQL

# GitHub's own analysis of the code for security faults: what reaches the
# page unescaped, what a crafted file could do. A finding appears under the
# repository's Security tab, and on the pull request that introduces it.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly as well, so a query added to CodeQL meets code nobody touched.
    - cron: '17 4 * * 1'

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          # Nothing to build: the analysis reads the source as it is written.
          build-mode: none
      - uses: github/codeql-action/analyze@v4
