name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to a branch makes the run before it pointless. Never on main:
# a cancelled run there is a commit nobody was ever told is broken.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# Every check below is a package script, so a job is what `npm run <name>` is
# on a laptop, and `npm run verify` is the three checking jobs in one.
jobs:
  static:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Prettier, ESLint with the architecture's boundaries, and Stylelint.
      - run: npm run lint
      # Types, in the modules and in the components' templates.
      - run: npm run check
      # Knip: unused files, exports and dependencies, then import cycles.
      - run: npm run analyze

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Fails under the coverage floor in vite.config.ts.
      - run: npm run test:unit

  browser:
    name: Build and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Builds the site with no map token, then runs every screen on the
      # sketch map, the accessibility audit included.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-test-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # openhikes.app is main as it last passed every job above. The only job
  # that sees a secret, and never on a pull request.
  deploy:
    name: Deploy
    needs: [static, unit, browser]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://openhikes.app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Without a token the build falls back to the sketch map, which nobody
      # would notice in a passing run.
      - name: Require the map token
        run: test -n "$MAPKIT_TOKEN" || { echo "::error::The MAPKIT_TOKEN secret is not set."; exit 1; }
        env:
          MAPKIT_TOKEN: ${{ secrets.MAPKIT_TOKEN }}
      - run: npm run build
        env:
          MAPKIT_TOKEN: ${{ secrets.MAPKIT_TOKEN }}
      # wrangler.jsonc says what is uploaded and where it is served.
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
