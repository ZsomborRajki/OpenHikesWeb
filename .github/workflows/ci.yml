name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to a branch makes the run before it pointless. Never on main:
# a cancelled run there is a commit nobody was ever told is broken.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# Every step below is a package script, so a job is what `npm run <name>` is
# on a laptop, and `npm run verify` is all three jobs in one.
jobs:
  static:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Prettier, ESLint with the architecture's boundaries, and Stylelint.
      - run: npm run lint
      # Types, in the modules and in the components' templates.
      - run: npm run check
      # Knip: unused files, exports and dependencies, then import cycles.
      - run: npm run analyze

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Fails under the coverage floor in vite.config.ts.
      - run: npm run test:unit

  browser:
    name: Build and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Builds the site with no map token, then runs every screen on the
      # sketch map, the accessibility audit included.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-test-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
